# CathodeOS GRUB 2 menu
#
# ISO contract:
#   /cathode/boot/bzImage
#   /cathode/boot/initrd.img
#   /cathode/installer/bzImage
#   /cathode/installer/initrd.img
#   /cathode/installer/rootfs.squashfs
#
# The cathode.mode= parameter is the hand-off contract between GRUB and the
# future CathodeOS/installer initramfs.

set timeout=8
set default=0

insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm

if [ -f /cathode/boot/background.png ]; then
    background_image /cathode/boot/background.png
fi

set gfxmode=auto

menuentry "Try CathodeOS" --class cathodeos {
    linux /cathode/boot/bzImage cathode.mode=live
    initrd /cathode/boot/initrd.img
}

menuentry "Install CathodeOS" --class cathodeos {
    linux /cathode/installer/bzImage cathode.mode=installer
    initrd /cathode/installer/initrd.img
}

menuentry "CathodeOS — Safe Graphics" --class cathodeos {
    linux /cathode/boot/bzImage cathode.mode=live nomodeset
    initrd /cathode/boot/initrd.img
}

submenu "Advanced options" --class cathodeos {
    menuentry "CathodeOS — Debug mode" {
        linux /cathode/boot/bzImage cathode.mode=live loglevel=7
        initrd /cathode/boot/initrd.img
    }

    menuentry "CathodeOS — Debug + Safe Graphics" {
        linux /cathode/boot/bzImage cathode.mode=live nomodeset loglevel=7
        initrd /cathode/boot/initrd.img
    }

    menuentry "Reboot" --class reboot {
        reboot
    }

    menuentry "Power off" --class shutdown {
        halt
    }
}

menuentry "UEFI Firmware Settings" --class firmware {
    fwsetup
}
