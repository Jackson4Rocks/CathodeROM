name: CathodeROM A16 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # This label is for a dedicated CathodeROM builder with >=64 GB RAM
    # and >=400 GB free disk. Standard GitHub-hosted runners are too small.
    runs-on: [self-hosted, linux, x64, cathoderom-builder]
    timeout-minutes: 720

    steps:
      - name: Check runner resources
        shell: bash
        run: |
          set -eux
          echo "CPU: $(nproc)"
          echo "RAM:"
          free -h
          echo "Disk:"
          df -h /
          AVAIL_KB="$(df -Pk / | awk 'NR==2 {print $4}')"
          if [ "$AVAIL_KB" -lt 314572800 ]; then
            echo "ERROR: CathodeROM needs a large build runner with substantial free disk."
            echo "At least ~300 GiB free is required before the build starts; AOSP's general guidance is ~400 GiB total for checkout + build."
            exit 1
          fi

      - name: Checkout CathodeROM manifest repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y             git-core gnupg flex bison build-essential zip curl             zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev             lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig             python3 python3-pip

      - name: Bootstrap Android 16
        shell: bash
        run: |
          set -eux
          chmod +x tools/bootstrap.sh
          ./tools/bootstrap.sh

      - name: Build CathodeROM
        shell: bash
        working-directory: aosp
        run: |
          set -eux
          source build/envsetup.sh
          lunch cathoderom_x86_64-userdebug
          m -j"$(nproc)"

      - name: Collect build artifacts
        shell: bash
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find aosp/out/target/product -maxdepth 2 -type f             \( -name '*.img' -o -name '*.zip' -o -name '*.iso' -o -name 'boot*' \)             -print -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cathoderom-a16-x86_64
          path: artifacts/
          if-no-files-found: warn
